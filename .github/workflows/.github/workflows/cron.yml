name: event-agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Måndagar 06:00 UTC (~07–08 Sverige)

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show file tree (sanity check)
        run: |
          pwd
          ls -la
          echo "---- .github/workflows ----"
          ls -la .github/workflows || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity import test
        run: |
          python - << 'PY'
          import feedparser, yaml, dateutil, icalendar, requests
          print("✅ Python imports OK")
          PY

      - name: Run agent
        run: |
          python agent.py --sources sources.yml --out out --days 60

      - name: List outputs
        if: always()
        run: |
          echo "---- out ----"
          ls -la out || true
          echo "---- preview ----"
          test -f out/events.md && tail -n +1 out/events.md || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-output
          path: out/*
          if-no-files-found: warn

