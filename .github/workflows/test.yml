name: event-agent
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure output
        run: |
          mkdir -p out
          echo "title,start_dt,end_dt,location,city,organizer,category,price,registration_url,source,source_url,description,id" > out/events.csv
          echo "# Placeholder" > out/events.md
      - name: Run agent (ignore errors)
        run: python agent.py --sources sources.yml --out out --days 365 || true
      - uses: actions/upload-artifact@v4
        with:
          name: events-output
          path: out/*
