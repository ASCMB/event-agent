name: event-agent
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python sanity check
        run: python -c "print('python funkar')"
      - name: Make artifact
        run: |
          mkdir -p out
          echo "ok" > out/test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: events-output
          path: out/*

