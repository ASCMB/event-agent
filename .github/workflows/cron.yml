name: event-agent
on:
  schedule:
    - cron: "0 6 * * 1"   # kör måndagar 06:00 UTC (~07–08 svensk tid)
  workflow_dispatch:      # så du kan köra manuellt
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run agent
  run: python agent.py --sources sources.yml --out out --days 180
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: events-output
          path: out/*

